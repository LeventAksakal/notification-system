# Six jobs in parallel (acceptance split into four shards), none waiting for
# another: each failure names its own job and step, and the wall time is the
# slowest job (an acceptance shard, about 4 to 5 min with a warm cache)
# instead of the sum (18 to 21 min as one job). The cost is
# per-job setup (about 25 s: Go download, cache restore) and per-job rounding
# up to the minute. Nothing waits for the static jobs: of the last four failed
# runs three failed in the integration tests, so a `needs:` would slow every
# green run to save minutes on a rare lint failure. Measurements:
# docs/REQUIREMENTS.md, the row "did you really write CI idiomatically".
#
# Every action is pinned by commit SHA: tags can be moved, and in March 2026
# trivy-action's were (CVE-2026-33634). Trivy itself runs from its image,
# pinned by digest.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  T: go tool -modfile=tools.mod
  TRIVY_IMAGE: aquasec/trivy:0.76.2@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb

# Linux only: it is what the image runs on. Windows, macOS and Linux are dev
# machines, not deploy targets; the cross-compile step catches a build break
# on them without a runner per OS.
jobs:
  build:
    name: "static: build, generated code, vulnerabilities, commit subjects"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the commit subject check reads the pushed range
      - uses: ./.github/actions/go
        with:
          cache-key: build
      # The same rule as the commit-msg hook, for clones that never installed it.
      # A pull request is checked out as a merge commit; the range names the
      # branch's own commits instead.
      - name: Commit subjects follow the conventional format
        env:
          RANGE: ${{ github.event_name == 'pull_request' && format('{0}..{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha) || format('{0}..{1}', github.event.before, github.sha) }}
        run: go run ./tools/commitcheck -range "$RANGE"
      - name: Builds for every dev machine
        run: |
          go build ./...
          GOOS=darwin GOARCH=arm64 go build ./...
          GOOS=windows GOARCH=amd64 go build ./...
      - name: Generated code is up to date
        run: |
          go generate ./...
          git diff --exit-code
      # The spec is generated from the server's code (decision 0024), so a
      # change to a handler's types can break clients without anyone editing
      # the file. --flatten-params: a parameter moved between a path and its
      # operations is the same parameter.
      - name: API contract keeps every client working (no breaking change against the base)
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          git show "$BASE:api/openapi.yaml" > "$RUNNER_TEMP/base-openapi.yaml"
          $T oasdiff breaking --flatten-params --fail-on ERR "$RUNNER_TEMP/base-openapi.yaml" api/openapi.yaml
      - name: Known vulnerabilities
        run: $T govulncheck ./...

  # Lint is CPU-bound and the drift check waits on Docker pulls and a MySQL
  # boot; together they still finish before the acceptance job, and one job
  # costs a billed minute less than two.
  lint:
    name: "static: lint, migration drift"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/go
        with:
          cache-key: lint
          extra-cache-path: ~/.cache/golangci-lint
      - name: Lint (fails on silent typecheck errors)
        run: go run ./tools/lintguard ./...
      - name: Migrations match schema/
        run: $T task migrate:check

  unit:
    name: "unit tests (race detector)"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/go
        with:
          cache-key: unit
      - name: Race tests
        run: go test -race ./...

  integration:
    name: "package integration tests (MySQL, Valkey)"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/go
        with:
          cache-key: integration
      - name: Package integration tests (MySQL, Valkey in containers), with the race detector
        run: go test -race -tags integration ./internal/...
      # The worker's own rate test once more, without the detector: with it the
      # in-process provider double counts arrivals in clumps whenever the
      # instrumented process stalls, so the cap is judged here.
      - name: Worker rate at the provider double, without the race detector
        run: go test -tags integration ./internal/delivery -run '^TestWorkersHoldTheRateAtTheProvider$' -count=1

  # No -race here: these tests drive the built binary from outside, so the
  # detector would only instrument the harness and the provider double and
  # take CPU the workers need. The rate floors need a machine that can keep
  # time to 10 ms; this runner has two cores, so only the cap (never more
  # than 100 in a second) and a sanity floor are asserted here. The strict
  # floors run with `task test:all` on a developer machine.
  # Four shards: the suite takes 843 s of test time on two cores (82 tests,
  # measured 16 Nov 2026 pinned to two cores), over go test's 10 min default
  # and this file's 4 min target. Shard i runs every test whose position in
  # the sorted `go test -list` output is i modulo 4, so a new test always lands
  # in exactly one shard; on that run the shards held 214, 215, 217 and 197 s.
  # Cost: four setups (about 25 s each) and four jobs rounded up to the minute,
  # about 20 billed minutes against one 15 min job that no longer fits.
  acceptance:
    name: "acceptance tests ${{ matrix.shard }}/4 (built binary, MySQL, Valkey, provider double)"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/go
        with:
          cache-key: acceptance
      - name: Acceptance tests, shard ${{ matrix.shard }} of 4
        env:
          ACCEPTANCE_RATE_FLOOR: "40"
          SHARD: ${{ matrix.shard }}
        run: |
          tests=$(go test -tags integration -list '.*' ./test/acceptance | grep '^Test' | sort | awk -v n=4 -v i="$SHARD" '(NR-1)%n==i' | paste -sd'|' -)
          test -n "$tests"
          go test -tags integration -timeout 14m -run "^(${tests})\$" ./test/acceptance
      - name: Test support package
        if: matrix.shard == 0
        run: go test -tags integration ./test/support

  # No Go on the runner: the image compiles inside Docker. No layer cache
  # either: the compile layer (70 s) re-runs on every commit, and the layers a
  # cache would keep (golang pull 12 s, module download 5 s) cost about as much
  # to export and restore.
  image:
    name: "image: build, CVE scan, stack comes up"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # One build for the app and the provider double: they share the build stage.
      - name: Build images
        run: docker compose build app provider
      - name: No HIGH or CRITICAL CVEs in the image
        run: >-
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$TRIVY_IMAGE"
          image --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed notifier:local
      - name: Stack comes up healthy
        run: |
          docker compose up --no-build --wait --wait-timeout 180
          curl -fsS http://127.0.0.1:8080/readyz
      - name: Stack logs on failure
        if: failure()
        run: docker compose logs --no-color

  # Optional AI review: runs only when the repository has the secret, so
  # forks and fresh clones stay green without it.
  claude-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    env:
      HAS_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.HAS_KEY == 'true'
      - uses: anthropics/claude-code-action@9008224dd4f743876f528e6ba0f0d611f076a7f9 # v1.0.271
        if: env.HAS_KEY == 'true'
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Review this pull request as the verifier role in .claude/agents/verifier.md.
            Report correctness bugs only, each with file:line and a failing scenario.
