info:
  description: |
    Accepts notification requests (sms, email, push), queues them, and delivers them to an
    external provider with rate limiting, priorities, retries and status tracking.

    This document is generated from the server's code (internal/httpapi); the server validates
    requests against the same schemas.

    Conventions
    - Every refused request has the `Error` body. `details` names each offending field
      (and the item index in a batch).
    - `400 invalid_request`: the body or a parameter breaks a rule (missing field, over a limit,
      unknown value). `404 not_found`. `409`: the resource is not in a state that allows the
      action. `422 idempotency_key_reused`: the key was used before with a different payload.
      `503 unavailable` with `Retry-After`: the database cannot be reached or did not answer in
      time. A create may or may not have been stored: repeat it with the same `Idempotency-Key`
      and it is stored once.
    - `X-Correlation-ID` may be sent on any request; one is generated when absent. It is echoed
      on the response, stored on the notification, written on every log line about it and sent
      to the provider.
    - `Idempotency-Key` on a create request stores the request once. A repeat with the same key
      and the same payload returns the first response (same ids) with `Idempotent-Replayed: true`.
    - Limits (single source: `internal/notification/limits.go`, each with its standard): sms `to` is
      E.164, content 1..1600 characters; email `to` is an address of at most 254 bytes, content
      1..32768 bytes; push `to` is a device token of 1..255 characters, content 1..4067 bytes.
      Bytes are UTF-8. `to`, content and a template body must hold a character that is not
      whitespace. A batch holds 1..1000 notifications. A request body is at most 8 MiB
      (`413 request_too_large`).
  title: Notification system
  version: 1.4.0
openapi: 3.0.3
paths:
  /healthz:
    get:
      operationId: health
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
          description: Alive
      summary: Liveness - the process is up
      tags:
        - operations
  /readyz:
    get:
      operationId: ready
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
          description: Ready
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
          description: A dependency is down
      summary: Readiness - MySQL and Valkey answer
      tags:
        - operations
  /v1/batches/{id}:
    get:
      operationId: getBatch
      parameters:
        - in: path
          name: id
          required: true
          schema:
            format: uuid
            type: string
        - explode: false
          in: query
          name: limit
          schema:
            default: 50
            maximum: 200
            minimum: 1
            type: integer
        - description: Opaque; the `nextCursor` of the previous page
          explode: false
          in: query
          name: cursor
          schema:
            description: Opaque; the `nextCursor` of the previous page
            maxLength: 52
            minLength: 1
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchStatus"
          description: Found
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
      summary: Counts per status and the items of one batch
      tags:
        - batches
  /v1/metrics:
    get:
      description: Computed from MySQL on every call, so every API instance returns the same numbers.
      operationId: getMetrics
      parameters:
        - description: How far back `delivery` looks
          explode: false
          in: query
          name: windowSeconds
          schema:
            default: 60
            description: How far back `delivery` looks
            maximum: 3600
            minimum: 1
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Metrics"
          description: Current numbers
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
      summary: Queue depth, success and failure rates, latency
      tags:
        - operations
  /v1/notifications:
    get:
      description: |
        Keyset pagination: pass `nextCursor` back as `cursor`. Pages never repeat or skip a row
        while new notifications arrive. Dead letters are `status=failed`.
      operationId: listNotifications
      parameters:
        - description: "`scheduled` selects pending notifications whose due time is in the future and that were never tried; `pending` selects the other pending ones."
          explode: false
          in: query
          name: status
          schema:
            $ref: "#/components/schemas/Status"
            description: "`scheduled` selects pending notifications whose due time is in the future and that were never tried; `pending` selects the other pending ones."
        - explode: false
          in: query
          name: channel
          schema:
            $ref: "#/components/schemas/Channel"
        - explode: false
          in: query
          name: batchId
          schema:
            format: uuid
            type: string
        - description: Inclusive lower bound on `createdAt`
          explode: false
          in: query
          name: createdFrom
          schema:
            description: Inclusive lower bound on `createdAt`
            format: date-time
            type: string
        - description: Exclusive upper bound on `createdAt`
          explode: false
          in: query
          name: createdTo
          schema:
            description: Exclusive upper bound on `createdAt`
            format: date-time
            type: string
        - explode: false
          in: query
          name: limit
          schema:
            default: 50
            maximum: 200
            minimum: 1
            type: integer
        - description: Opaque; the `nextCursor` of the previous page
          explode: false
          in: query
          name: cursor
          schema:
            description: Opaque; the `nextCursor` of the previous page
            maxLength: 52
            minLength: 1
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationPage"
          description: One page
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
      summary: List notifications, newest first
      tags:
        - notifications
    post:
      description: Returns as soon as the notification is stored; delivery happens in the workers.
      operationId: createNotification
      parameters:
        - description: Visible ASCII, no spaces
          in: header
          name: Idempotency-Key
          schema:
            description: Visible ASCII, no spaces
            maxLength: 255
            minLength: 1
            pattern: ^[!-~]+$
            type: string
        - in: header
          name: X-Correlation-ID
          schema:
            maxLength: 55
            minLength: 1
            pattern: ^[A-Za-z0-9._:-]+$
            type: string
      requestBody:
        content:
          application/json:
            examples:
              scheduled:
                value:
                  channel: push
                  content: Sale starts now
                  scheduledAt: "2026-12-01T09:00:00Z"
                  to: device-token-1
              sms:
                value:
                  channel: sms
                  content: Your code is 4821
                  priority: high
                  to: "+905551234567"
              template:
                value:
                  channel: email
                  template:
                    name: welcome
                    variables:
                      name: Ada
                  to: ada@example.com
            schema:
              $ref: "#/components/schemas/NotificationCreate"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Notification"
          description: Stored and queued
          headers:
            Idempotent-Replayed:
              schema:
                description: Present and `true` when this response repeats an earlier one for the same Idempotency-Key
                enum:
                  - "true"
                type: string
            X-Correlation-ID:
              schema:
                description: The correlation id in force for this request
                type: string
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "413":
          $ref: "#/components/responses/RequestTooLarge"
        "422":
          $ref: "#/components/responses/IdempotencyKeyReused"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
      summary: Queue one notification
      tags:
        - notifications
  /v1/notifications/batch:
    post:
      description: Every item is validated first; then all are stored with the batch, or nothing is.
      operationId: createBatch
      parameters:
        - description: Visible ASCII, no spaces
          in: header
          name: Idempotency-Key
          schema:
            description: Visible ASCII, no spaces
            maxLength: 255
            minLength: 1
            pattern: ^[!-~]+$
            type: string
        - in: header
          name: X-Correlation-ID
          schema:
            maxLength: 55
            minLength: 1
            pattern: ^[A-Za-z0-9._:-]+$
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BatchCreate"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchCreated"
          description: All stored and queued
          headers:
            Idempotent-Replayed:
              schema:
                description: Present and `true` when this response repeats an earlier one for the same Idempotency-Key
                enum:
                  - "true"
                type: string
            X-Correlation-ID:
              schema:
                description: The correlation id in force for this request
                type: string
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "413":
          $ref: "#/components/responses/RequestTooLarge"
        "422":
          $ref: "#/components/responses/IdempotencyKeyReused"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
      summary: Queue up to 1000 notifications atomically
      tags:
        - batches
  /v1/notifications/{id}:
    get:
      operationId: getNotification
      parameters:
        - in: path
          name: id
          required: true
          schema:
            format: uuid
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Notification"
          description: Found; `deliveryAttempts` is included
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
      summary: Status, attempt count, last error and the attempt history of one notification
      tags:
        - notifications
    patch:
      description: |
        Sets `scheduledAt` (and so `dueAt`) under the same rules as create. Allowed while the
        notification is pending and no worker has picked it up: `scheduled`, or `pending` and due but not
        yet claimed. One a worker already picked up is refused (409; the message names the status): one
        waiting for a retry, so a reschedule never overrides a retry backoff or a provider's Retry-After, and
        one handed back unsent while its channel was paused, which shows as `scheduled` until it is due. A
        reschedule racing a worker has exactly one winner. No WebSocket event is sent: the stored status does
        not change.
      operationId: rescheduleNotification
      parameters:
        - in: path
          name: id
          required: true
          schema:
            format: uuid
            type: string
      requestBody:
        content:
          application/json:
            examples:
              later:
                value:
                  scheduledAt: "2026-12-01T09:00:00Z"
              now:
                value:
                  scheduledAt: null
            schema:
              $ref: "#/components/schemas/NotificationReschedule"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Notification"
          description: Rescheduled; the notification as stored now
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
      summary: Reschedule a notification that no worker has picked up
      tags:
        - notifications
  /v1/notifications/{id}/cancel:
    post:
      description: Allowed from `pending` only (including scheduled and waiting to retry). A cancel racing a worker has exactly one winner.
      operationId: cancelNotification
      parameters:
        - in: path
          name: id
          required: true
          schema:
            format: uuid
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Notification"
          description: Cancelled; it will never reach the provider
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
      summary: Cancel a notification that has not been picked up
      tags:
        - notifications
  /v1/notifications/{id}/retry:
    post:
      description: Allowed from `failed` only. The notification returns to `pending` with a fresh attempt budget; its attempt history is kept.
      operationId: retryNotification
      parameters:
        - in: path
          name: id
          required: true
          schema:
            format: uuid
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Notification"
          description: Queued again
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
      summary: Replay a dead letter
      tags:
        - notifications
  /v1/templates:
    get:
      operationId: listTemplates
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TemplateList"
          description: Templates
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
      summary: All templates, by name
      tags:
        - templates
  /v1/templates/{name}:
    delete:
      operationId: deleteTemplate
      parameters:
        - in: path
          name: name
          required: true
          schema:
            $ref: "#/components/schemas/TemplateName"
      responses:
        "204":
          description: Deleted
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
      summary: Delete a template
      tags:
        - templates
    get:
      operationId: getTemplate
      parameters:
        - in: path
          name: name
          required: true
          schema:
            $ref: "#/components/schemas/TemplateName"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Template"
          description: Found
          headers:
            ETag:
              schema:
                description: The template's version as a strong ETag, such as "3"; send it back in If-Match
                type: string
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
      summary: Read one template
      tags:
        - templates
    put:
      description: |
        Variables are written `{{name}}`. Replacing a template never changes a notification that
        was already accepted: content is rendered at intake.

        Optimistic concurrency: every template has a `version`, 1 when created and one more on
        every update, also sent as a strong `ETag` (`"3"`). Without `If-Match` the request
        creates the template (`201`); if it already exists the answer is `428` with its current
        version. With `If-Match` set to the version last read, the template is replaced (`200`);
        any other version, or a template that no longer exists, is `412` and nothing changes.
      operationId: putTemplate
      parameters:
        - in: path
          name: name
          required: true
          schema:
            $ref: "#/components/schemas/TemplateName"
        - description: "The template's `ETag` as last read, such as `\"3\"`. Required to replace an existing template; absent to create one. One strong ETag only: `*`, weak and listed ETags are refused. At most 10 digits, because a version is a MySQL INT UNSIGNED (at most 4294967295)."
          in: header
          name: If-Match
          schema:
            description: "The template's `ETag` as last read, such as `\"3\"`. Required to replace an existing template; absent to create one. One strong ETag only: `*`, weak and listed ETags are refused. At most 10 digits, because a version is a MySQL INT UNSIGNED (at most 4294967295)."
            pattern: ^"[1-9][0-9]{0,9}"$
            type: string
      requestBody:
        content:
          application/json:
            examples:
              welcome:
                value:
                  body: Hello {{name}}, welcome aboard.
            schema:
              $ref: "#/components/schemas/TemplateWrite"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Template"
          description: Replaced
          headers:
            ETag:
              schema:
                description: The template's version as a strong ETag, such as "3"; send it back in If-Match
                type: string
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Template"
          description: Created
          headers:
            ETag:
              description: The template's version as a strong ETag, such as `"3"`; send it back in `If-Match`
              schema:
                type: string
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "412":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "`If-Match` is not the current version, or the template no longer exists (`precondition_failed`); the detail's `currentVersion` is the current one when it exists"
        "428":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: The template exists and replacing it needs `If-Match` (`precondition_required`); the detail's `currentVersion` is the current one
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
      summary: Create or replace a template
      tags:
        - templates
  /v1/ws:
    get:
      description: |
        Upgrades to a WebSocket. Each text message is one `StatusEvent` as JSON. With
        `notificationId`, the first message is a snapshot of that notification's current status
        (`snapshot: true`), then its changes follow in order. With `batchId`, changes of that
        batch's notifications follow. With neither, every change follows. The REST API stays the
        source of truth. The server closes the stream rather than deliver a stream with holes: a slow
        subscriber is disconnected, and so is every subscriber when the server loses its event feed
        (reconnect and read the snapshot). Within a notification, events arrive in `seq` order.

        The server ends a stream with one of these close codes:
        - `1008`: the subscriber fell behind and events were dropped (the send buffer, APP_WS_SEND_BUFFER, filled); resubscribe.
        - `1012`: the server lost its event feed, so changes may be missing; reconnect (503 until the feed is back) and read the snapshot.
        - `1001`: the server is shutting down; reconnect.
        - `1008`: the client sent a data message; clients send none on this stream.
        - `1002`: the client broke the WebSocket framing (an unmasked or fragmented control frame, reserved bits or an unknown opcode); the reason is the library's description of the fault.
      operationId: streamEvents
      parameters:
        - in: query
          name: notificationId
          schema:
            format: uuid
            type: string
        - in: query
          name: batchId
          schema:
            format: uuid
            type: string
      responses:
        "101":
          description: Switching protocols; `StatusEvent` messages follow
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/LiveUpdatesUnavailable"
      summary: WebSocket stream of status changes
      tags:
        - operations
      x-websocket-message:
        $ref: "#/components/schemas/StatusEvent"
servers:
  - url: http://localhost:8080
tags:
  - name: notifications
  - name: batches
  - name: templates
  - name: operations
