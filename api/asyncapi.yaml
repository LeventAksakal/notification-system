# Code generated by internal/httpapi/asyncapigen from the server's code; DO NOT EDIT.
# Change the stream in internal/httpapi (stream_event.go, stream_asyncapi.go), then run `go generate ./internal/httpapi`.
asyncapi: 3.0.0
info:
  title: Notification system status stream
  version: 2.0.0
  description: "The WebSocket half of the Notification system contract. Like the OpenAPI document (api/openapi.yaml), it is generated from the server's code (internal/httpapi), and its payload schemas are that document's, by the same names. They are JSON Schema as Huma writes it, within what AsyncAPI's default schema format (a superset of JSON Schema draft 07) reads. A field may be added to a message in a minor version: ignore fields you do not know."
defaultContentType: application/json
servers:
  local:
    host: localhost:8080
    protocol: ws
    description: The development server, as in the OpenAPI document. Behind TLS the protocol is `wss` and the host is the deployment's.
channels:
  statusEvents:
    address: /v1/ws
    title: Status changes of notifications
    description: |-
      Upgrade GET /v1/ws to a WebSocket and receive notifications' status changes: each text message is one `StatusEvent` as JSON. The REST API stays the source of truth: the stream says what changed, and a client that may have missed something reads the notification. The query parameters (the `ws` binding's `query`) choose which notifications' changes follow.

      Clients send no messages. A data message from the client ends the stream with close code 1008 (`unexpected data message`); ping and close frames are answered (RFC 6455 section 5.5).

      The server pings every 20s; WebSocket libraries answer with a pong on their own. When a message or a ping cannot be written to the client within 10s, or the client is gone, the server drops the connection without a close frame; client libraries then report 1006, a code that is never sent (RFC 6455 section 7.4.1). Reconnect.

      The server ends a stream with a close frame from `x-close-codes` (code, reason text, when, standard). It closes rather than go on with a hole: on any of them, reconnect and read the current state. After 1012, expect 503 until the event feed is back, and retry with backoff.

      An upgrade that is not accepted is answered over HTTP, as listed in `x-handshake-refusals` in the order the server checks.
    servers:
      - $ref: "#/servers/local"
    messages:
      snapshot:
        $ref: "#/components/messages/snapshot"
      statusChange:
        $ref: "#/components/messages/statusChange"
    bindings:
      ws:
        method: GET
        query:
          properties:
            batchId:
              description: "Subscribe to the notifications of one batch: their changes follow, each notification's in `seq` order; there is no snapshot, read GET /v1/batches/{id} for the current state. A batch that does not exist is refused with `404 not_found`. With `notificationId` as well, that notification's snapshot comes first and its changes follow only if it is in this batch (if not, none ever do). With neither parameter, every notification's changes follow, with no snapshot. A UUID: `f81d4fae-7dec-11d0-a765-00a0c91e6bf6`; upper case, a `urn:uuid:` prefix (any case), braces and the 32 hex digits without hyphens are accepted too. Anything else is refused with `400 invalid_request` naming this parameter in `details[].field`"
              format: uuid
              type: string
            notificationId:
              description: "Subscribe to one notification. The first message is its snapshot (`snapshot: true`, its current status as GET /v1/notifications/{id} reads it), then its changes follow in `seq` order. A notification that does not exist (or has expired) is refused with `404 not_found`. A UUID: `f81d4fae-7dec-11d0-a765-00a0c91e6bf6`; upper case, a `urn:uuid:` prefix (any case), braces and the 32 hex digits without hyphens are accepted too. Anything else is refused with `400 invalid_request` naming this parameter in `details[].field`"
              format: uuid
              type: string
          type: object
        bindingVersion: 0.1.0
    x-handshake-refusals:
      - status: 400
        code: invalid_request
        contentType: application/json
        description: A query parameter is not a UUID; `details[].field` names it. Fix the request; repeating it fails the same way.
        payload:
          $ref: "#/components/schemas/Error"
      - status: 503
        code: unavailable
        contentType: application/json
        description: "Live updates are unavailable (`unavailable`): this instance has no event feed (it lost it, or has just started and is still connecting it), or is shutting down. The REST API still answers; reconnect shortly. When the database is what cannot be reached, the body says so and `Retry-After` is set."
        payload:
          $ref: "#/components/schemas/Error"
      - status: 404
        code: not_found
        contentType: application/json
        description: "`notificationId` or `batchId` names a notification or batch that does not exist; `message` says which. Do not retry with the same id."
        payload:
          $ref: "#/components/schemas/Error"
      - status: 500
        code: internal
        contentType: application/json
        description: Looking up the notification or batch failed unexpectedly. Retry with backoff.
        payload:
          $ref: "#/components/schemas/Error"
      - status: 426
        contentType: text/plain
        description: "The request is not a WebSocket upgrade: HTTP/1.0, or no `Connection: Upgrade` and `Upgrade: websocket` (RFC 6455 section 4.2.1). Checked after the refusals above, so a plain GET learns about bad ids first."
      - status: 400
        contentType: text/plain
        description: "`Sec-WebSocket-Version` is not 13, or `Sec-WebSocket-Key` is missing, repeated or not 16 bytes in base64 (RFC 6455 section 4.2.1). WebSocket client libraries send these right; this is a hand-made handshake."
      - status: 403
        contentType: text/plain
        description: "The `Origin` header names a host other than the request's `Host`: a browser page served from another origin may not open the stream (RFC 6455 section 10.2). Clients outside a browser send no `Origin`."
    x-close-codes:
      - code: 1008
        reason: "too slow: events were dropped; resubscribe"
        description: the subscriber fell behind and events were dropped (the send buffer, APP_WS_SEND_BUFFER, filled); resubscribe
        reference: RFC 6455 section 7.4.1, https://www.rfc-editor.org/rfc/rfc6455#section-7.4.1
      - code: 1012
        reason: event feed lost; reconnect and read the snapshot
        description: the server lost its event feed, so changes may be missing; reconnect (503 until the feed is back) and read the snapshot
        reference: IANA WebSocket Close Code Number Registry (RFC 6455 section 11.7), https://www.iana.org/assignments/websocket/websocket.xhtml#close-code-number
      - code: 1001
        reason: server shutting down
        description: the server is shutting down; reconnect
        reference: RFC 6455 section 7.4.1, https://www.rfc-editor.org/rfc/rfc6455#section-7.4.1
      - code: 1008
        reason: unexpected data message
        description: the client sent a data message; clients send none on this stream
        reference: RFC 6455 section 7.4.1, https://www.rfc-editor.org/rfc/rfc6455#section-7.4.1
      - code: 1002
        description: the client broke the WebSocket framing (an unmasked or fragmented control frame, reserved bits or an unknown opcode); the reason is the library's description of the fault
        reference: RFC 6455 section 7.4.1, https://www.rfc-editor.org/rfc/rfc6455#section-7.4.1
operations:
  sendStatusEvents:
    action: send
    channel:
      $ref: "#/channels/statusEvents"
    title: Send status events
    description: The server sends these on every accepted stream; the client only receives.
    messages:
      - $ref: "#/channels/statusEvents/messages/snapshot"
      - $ref: "#/channels/statusEvents/messages/statusChange"
components:
  messages:
    snapshot:
      name: snapshot
      title: Snapshot
      summary: The notification's current status, first on a `notificationId` subscription
      description: "Sent once, as the first message, when the subscription names `notificationId`, and never otherwise. `snapshot` is true. `status` is the notification's status as GET /v1/notifications/{id} reads it, so it may be `scheduled`. `seq` is the status sequence the snapshot shows: every later message about this notification has a greater one."
      contentType: application/json
      payload:
        $ref: "#/components/schemas/StatusEvent"
      examples:
        - name: pendingSnapshot
          summary: A notification waiting for its first attempt
          payload:
            notificationId: 0193a2c4-5e6f-7a8b-9c0d-1e2f3a4b5c6d
            status: pending
            attempts: 0
            at: "2026-11-16T09:30:00Z"
            correlationId: 6f1c2d3e-4a5b-4c6d-8e7f-9a0b1c2d3e4f
            seq: 1
            snapshot: true
    statusChange:
      name: statusChange
      title: Status change
      summary: One committed status change of a notification the subscription matches
      description: "Sent after each status change is committed. A notification's messages arrive in increasing `seq` without repeats, and never one older than what the stream has already sent; messages of different notifications have no order among them. A gap in `seq` means a change was lost (its event never arrived, or arrived after the server stopped waiting for it): read the notification over REST. `snapshot` is absent. Without `seq` (an event from a server older than the sequence) the message is passed on unordered."
      contentType: application/json
      payload:
        $ref: "#/components/schemas/StatusEvent"
      examples:
        - name: sent
          summary: The provider accepted the notification
          payload:
            notificationId: 0193a2c4-5e6f-7a8b-9c0d-1e2f3a4b5c6d
            status: sent
            attempts: 1
            at: "2026-11-16T09:30:02Z"
            correlationId: 6f1c2d3e-4a5b-4c6d-8e7f-9a0b1c2d3e4f
            seq: 3
        - name: retrying
          summary: An attempt failed and the notification waits for a retry
          payload:
            notificationId: 0193a2c4-5e6f-7a8b-9c0d-1e2f3a4b5c6d
            status: pending
            attempts: 1
            error: provider answered 503 Service Unavailable
            at: "2026-11-16T09:30:02Z"
            correlationId: 6f1c2d3e-4a5b-4c6d-8e7f-9a0b1c2d3e4f
            seq: 3
  schemas:
    Error:
      properties:
        code:
          description: "Machine-readable cause, one of: invalid_request, not_found, not_cancellable, not_retryable, not_reschedulable, precondition_failed, precondition_required, idempotency_key_reused, request_too_large, unavailable, internal"
          type: string
        details:
          description: One entry per broken rule on an invalid_request; absent otherwise
          items:
            $ref: "#/components/schemas/ErrorDetail"
          type: array
        message:
          description: A human-readable summary; not stable, do not parse it
          type: string
      required:
        - code
        - message
      type: object
    ErrorDetail:
      properties:
        currentVersion:
          description: On `If-Match` (412, 428), the template's current version; absent when the template does not exist
          type: integer
        field:
          description: The JSON field the rule applies to, as a dotted path from the request body (to, template.variables, scheduledAt)
          type: string
        index:
          description: Position of the item in a batch request
          type: integer
        missing:
          description: On `template.variables`, the required variables the request did not send
          items:
            type: string
          type: array
        reason:
          description: What is wrong with the field, in words a person can act on
          type: string
        required:
          description: On `template.variables`, the variables the template uses, in order of first appearance
          items:
            type: string
          type: array
        unknown:
          description: On `template.variables`, variables sent that the template does not use, sorted; `[]` when none (accepted on their own, listed to help spot a typo)
          items:
            type: string
          type: array
      required:
        - field
        - reason
      type: object
    Status:
      description: |
        Stored states are pending, processing, sent, failed and cancelled. `scheduled` is shown
        for a pending notification whose due time is in the future and that was never tried.
        `sent` means the provider accepted it; the provider never confirms delivery.
      enum:
        - scheduled
        - pending
        - processing
        - sent
        - failed
        - cancelled
      type: string
    StatusEvent:
      description: One message on the WebSocket stream
      properties:
        at:
          description: When the change was made, by the server's clock, in UTC (RFC 3339). On a snapshot, when the notification last changed
          format: date-time
          type: string
        attempts:
          description: Delivery attempts that have ended so far (the provider answered, the call failed, or the worker's lease ran out); 0 before the first one ends and again after a replay
          type: integer
        batchId:
          description: The batch the notification was created in; absent for a notification created on its own
          format: uuid
          type: string
        correlationId:
          description: The `X-Correlation-ID` stored with the notification when it was created; every log line and trace about it carries the same id
          type: string
        error:
          description: The last delivery error recorded for the notification, as text for a person; absent when none was recorded. Branch on `status`, not on this text
          type: string
        notificationId:
          description: "The notification this message is about: its `id` in the REST API (GET /v1/notifications/{id}). Lower case, with hyphens"
          format: uuid
          type: string
        seq:
          description: "The notification's status sequence: 1 at creation, one more with every status change. A stream sends a notification's events in this order without repeats; a gap means a change was lost, read the notification. Absent when unknown"
          minimum: 0
          type: integer
        snapshot:
          description: True on the first message of a `notificationId` subscription
          type: boolean
        status:
          $ref: "#/components/schemas/Status"
          description: The notification's status after this change. A snapshot shows it as GET /v1/notifications/{id} does, so it may be `scheduled`; a change shows the stored status, never `scheduled` (a notification created with a future due time arrives as `pending`)
      required:
        - notificationId
        - status
        - attempts
        - at
        - correlationId
      type: object
